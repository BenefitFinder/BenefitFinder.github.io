<p class="feedback-link"></p>
  <a href="{{ '/feedback/' | relative_url }}"> See something wrong? Tell us here!</a>
</p>

<style>

.feedback-link {
  margin-top: 1rem;
  text-align: center;
  font-size: 0.9rem;
  color: var(--text-color);
}

.feedback-link a {
  color: var(--link-color);
  font-weight: 600;
}

.feedback-link a:hover {
  text-decoration: underline;
}

</style>

<script src="https://unpkg.com/intro.js/minified/intro.min.js"></script>

<!-- intro JS tour code -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const btn = document.getElementById("take-tour-btn");
    if (!btn) return;
  
    btn.addEventListener("click", function () {
      const tour = introJs();
  
      const isMobile = () => window.matchMedia("(max-width: 768px)").matches;
  
      const openMobileMenu = () => {
        const toggle = document.querySelector(".greedy-nav__toggle");
        const menu   = document.querySelector(".greedy-nav .hidden-links");

        // If menu exists but is hidden, open it
        if (toggle && menu && menu.offsetParent === null) {
          toggle.click();
        }
      };

      const closeMobileMenu = () => {
        const toggle = document.querySelector(".greedy-nav__toggle");
        const menu   = document.querySelector(".greedy-nav .hidden-links");

        // If menu exists and is visible, close it
        if (toggle && menu && menu.offsetParent !== null) {
          toggle.click();
        }
      };
  
      tour.setOptions({
        steps: [
          {
            element: document.querySelector('nav a[href="/"]'),
            intro: "Get back to this page at any time by clicking here."
          },
          {
            element: document.querySelector('nav a[href="/Articles/"]'),
            intro: "You can view the comprehensive list of all benefits we track here."
          },
          {
            element: document.querySelector('nav a[href="/FindBenefits/"]'),
            intro: "Enter information about yourself here to find benefits you are eligible for."
          },
          {
            element: document.querySelector('button.search__toggle'),
            intro: "Click here to search the entire website."
          },
          {
            element: document.querySelector('#learn-more'),
            intro: "Learn more about how benefits can help you!",
            position: "bottom"
          }
        ]
      });
  
      tour.onbeforechange(function (targetElement) {
        const needsMenu =
          targetElement?.matches('nav a[href="/Articles/"]') ||
          targetElement?.matches('nav a[href="/FindBenefits/"]');
        console.log(needsMenu)

        if (isMobile()) {
          if (needsMenu) {
            openMobileMenu();   // Open the mobile menu if needed
          } else {
            closeMobileMenu();  // Close it if not
          }
        }
      });
  
      tour.start();
    });
  });
  </script>
